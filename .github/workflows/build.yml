name: Windows build
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore GaameTranslate.sln
      - run: dotnet build GaameTranslate.sln -c Release --no-restore
      - run: dotnet test tests/GaameTranslate.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results
      - run: ./scripts/Publish.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: GaameTranslate-win-x64
          path: artifacts/publish/win-x64
